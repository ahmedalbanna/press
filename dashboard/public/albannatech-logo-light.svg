<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="100%" height="100%">
  <!--
    Light variant of albannatech-logo.svg, for dark backgrounds (the dashboard
    sidebar). The default wordmark paints "Albanna" in #0F172A, which is the
    same navy as the sidebar, so that half of the name disappeared. Here the
    wordmark inverts instead: light text, the blue accent kept, and the icon
    mark flipped so it stays visible rather than blending into the panel.
  -->

  <!-- Icon Mark (A+T Fusion) -->
  <g transform="translate(5, 5)">
    <rect width="50" height="50" rx="12" fill="#F8FAFC" />
    <path d="M25 12 L37 38 H31 L25 24 L19 38 H13 Z" fill="#0F172A" />
    <path d="M25 18 L29 27 H21 Z" fill="#0EA5E9" />
  </g>

  <!-- Typography: AlbannaTech -->
  <text x="68" y="30" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">
    Albanna<tspan fill="#0EA5E9">Tech</tspan>
  </text>

  <!-- Sub-text: Arabic Branding -->
  <text x="68" y="47" font-family="'Cairo', 'Tajawal', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">
    البناء للتكنولوجيا
  </text>
</svg>