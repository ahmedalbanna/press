line-length = 110
indent-width = 4
# py310 matches requires-python. Raising it turns on py311+ upgrade rules across
# the whole tree (66 findings: TC001-3, UP017/042/043/046/047) — a separate
# refactor, not something to land inside a version-compatibility change.
target-version = "py310"

[format]
quote-style = "double"
indent-style = "tab"


[lint]
select = [
  "F",
  "E",
  "W",
  "I",
  "UP",
  "B",
  "RUF",
  "FA",
  "TCH",
  "C90",
  "RET",
  "SIM",
  # DTZ003 (`datetime.utcnow()`) is removed in Python 3.15, so it is a build
  # failure waiting for a version bump. Scoped to that one rule: the rest of the
  # datetimez ruleset reports 327 pre-existing findings (DTZ001/005/006/007/011
  # -- naive `now()`, `date.today()`, strptime without %z), most of which are
  # correct as written. Widening it belongs in its own change, with the
  # behaviour-preserving conversions worked out per call site.
  "DTZ003",
]
ignore = [
  "UP015",  # Unnecessary open mode parameters
  "SIM108", # Use ternary operator {contents} instead of if-else-block
  "F821",   # Undefined name, cause of DF.Literal
  "F722",   # syntax error in forward type annotation, cause of DF.Literal
  "E501",   # line too long, cause hooks.py
  "W191",   # indentation contains tabs, cause when the world zigs, we zag
  "B023",   # function doesn't bind loop variable - will have last iteration's value
  "UP037",  # remove quotes from annotations, messes up DF.Literal typing
  "SIM103", # return condition directly, readability suffers at times
]


[lint.mccabe]
max-complexity = 8
[lint.per-file-ignores]
"**/test_*.py" = ["C901"]  # ignore too complex in tests
